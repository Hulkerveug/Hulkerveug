<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">XTOBE APEX 4.0 cinematic hero</title>
  <desc id="desc">Cinematic XTOBE hero with layered geometry, refined lighting, and readable editorial wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="60%" stop-color="#0C1525"/>
      <stop offset="100%" stop-color="#142238"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#DCE9F2" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Subtle gradient vignette -->
  <ellipse cx="800" cy="420" rx="520" ry="310" fill="#000" opacity="0.12"/>

  <!-- Reactor orbital strokes -->
  <g stroke="url(#accent)" stroke-width="1.2" fill="none" opacity="0.22">
    <ellipse cx="820" cy="420" rx="280" ry="140"/>
    <ellipse cx="820" cy="420" rx="380" ry="200"/>
    <ellipse cx="820" cy="420" rx="480" ry="250"/>
  </g>

  <!-- Core geometric mark -->
  <g transform="translate(520 230)" filter="url(#softGlow)">
    <path d="M80 0 L240 0 L320 120 L240 300 L80 300 L0 120 Z" fill="#071028" stroke="url(#accent)" stroke-width="2.2"/>
    <path d="M160 20 L220 20 L280 80 L220 260 L160 260 L100 80 Z" fill="#0D1A2B" stroke="#DCE9F2" stroke-width="1.4" opacity="0.9"/>

    <!-- internal technical strokes -->
    <path d="M40 120 H280" stroke="#67E8F9" stroke-width="1.6" opacity="0.9"/>
    <path d="M60 160 H260" stroke="#8196AF" stroke-width="1.2" opacity="0.75"/>
    <circle cx="160" cy="120" r="18" fill="url(#accent)" opacity="0.95"/>
  </g>

  <!-- Wordmark and editorial headlines -->
  <g fill="#DCE9F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="820" y="520" font-size="104" font-weight="700" letter-spacing="6">XTOBE</text>
    <text x="820" y="600" font-size="28" font-weight="600" fill="#8196AF">INTELLIGENT SYSTEMS RESEARCH</text>
    <text x="820" y="648" font-size="20" font-weight="600" fill="#67E8F9" letter-spacing="6">ENGINEERING INTELLIGENCE THAT PROTECTS LIVES</text>
  </g>

  <!-- Fine cyan rails -->
  <g opacity="0.95">
    <rect x="220" y="120" width="180" height="2" fill="#67E8F9"/>
    <rect x="1200" y="120" width="180" height="2" fill="#67E8F9"/>
    <rect x="220" y="760" width="180" height="2" fill="#67E8F9"/>
    <rect x="1200" y="760" width="180" height="2" fill="#67E8F9"/>
  </g>

  <!-- Small supporting line of copy -->
  <g fill="#8196AF" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="820" y="700" font-size="14" opacity="0.95">Founder — Nishan Ramanathan · United Arab Emirates</text>
  </g>
</svg>
