<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">XTOBE APEX 3.0 hero graphic</title>
  <desc id="desc">A premium aerospace-inspired XTOBE identity with geometric lines, cyan accents, and engineering architecture cues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="48%" stop-color="#0C1525"/>
      <stop offset="100%" stop-color="#142238"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="35%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#DCE9F2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.26" stroke="#67E8F9" stroke-width="1">
    <circle cx="820" cy="450" r="300" fill="none"/>
    <circle cx="820" cy="450" r="360" fill="none"/>
    <circle cx="820" cy="450" r="420" fill="none"/>
    <path d="M120 450 H1540"/>
    <path d="M820 80 V820"/>
  </g>

  <g opacity="0.2" stroke="#DCE9F2" stroke-width="1">
    <path d="M350 210 L1250 210"/>
    <path d="M350 690 L1250 690"/>
  </g>

  <g transform="translate(360 200)" filter="url(#glow)">
    <path d="M120 0 L240 0 L320 80 L160 360 L40 360 L120 0 Z" fill="none" stroke="url(#cyan)" stroke-width="3"/>
    <path d="M200 0 L80 0 L0 80 L160 360 L280 360 L200 0 Z" fill="none" stroke="#DCE9F2" stroke-width="2.2" opacity="0.9"/>
    <path d="M110 40 H200" stroke="#67E8F9" stroke-width="3"/>
    <path d="M100 100 H240" stroke="#8196AF" stroke-width="2" opacity="0.8"/>
    <path d="M76 140 H245" stroke="#8196AF" stroke-width="1.6" opacity="0.7"/>
    <path d="M136 178 L236 278" stroke="#67E8F9" stroke-width="2.2"/>
    <path d="M203 178 L103 278" stroke="#67E8F9" stroke-width="2.2"/>
  </g>

  <g fill="#DCE9F2" font-family="Segoe UI, Helvetica, Arial, sans-serif" letter-spacing="8">
    <text x="820" y="520" text-anchor="middle" font-size="82" font-weight="700">XTOBE</text>
    <text x="820" y="620" text-anchor="middle" font-size="26" font-weight="600" fill="#8196AF">APEX 3.0</text>
  </g>

  <g fill="#67E8F9" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="820" y="680" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="6">INTELLIGENCE BEYOND THE INTERFACE</text>
  </g>

  <g opacity="0.9">
    <rect x="300" y="130" width="220" height="2" fill="#67E8F9"/>
    <rect x="1080" y="130" width="220" height="2" fill="#67E8F9"/>
    <rect x="300" y="760" width="220" height="2" fill="#67E8F9"/>
    <rect x="1080" y="760" width="220" height="2" fill="#67E8F9"/>
  </g>
</svg>
